  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f4f9;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      padding: 32px 20px;
      line-height: 1.5;
      color: #1e293b;
    }

    .main-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Kort / panel-stil */
    .form-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.02);
      padding: 1.8rem 2rem;
      transition: box-shadow 0.2s;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1f2b3c, #2c3e66);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
      letter-spacing: -0.3px;
    }

    .subhead {
      color: #4a5b6e;
      border-left: 4px solid #1f6feb;
      padding-left: 14px;
      margin: 8px 0 24px 0;
      font-weight: 450;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 1.2rem 0 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* form labels & inputs */
    .field-group {
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: #0f172a;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      background: #fff;
      transition: all 0.2s ease;
      width: 100%;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.2);
    }

    /* knapunivers */
    button {
      font-family: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.97);
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      background: #1f6feb;
      color: white;
      border: none;
      box-shadow: 0 4px 8px rgba(31, 111, 235, 0.2);
    }

    .primary:hover {
      background: #0f5fd9;
      transform: translateY(-1px);
    }

    .addBtn {
      background: #2b8a3e;
      color: white;
      border: none;
      box-shadow: 0 2px 6px rgba(43, 138, 62, 0.2);
    }

    .addBtn:hover {
      background: #1e7a34;
    }

    .removeBtn {
      background: #fff0f0;
      color: #c2410c;
      border: 1px solid #ffd9d9;
    }

    .removeBtn:hover {
      background: #ffe0e0;
      color: #9b2c1d;
      border-color: #ffb3b3;
    }

    .download {
      background: #6b5cff;
      color: white;
      border: none;
    }

    .download:hover {
      background: #5a4ce0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      padding-top: 8px;
      border-top: 1px solid #eef2f6;
    }

    /* DARIS bokse – kort med interaktivt header */
    .darisBox {
      background: #ffffff;
      border-radius: 24px;
      margin-top: 20px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
      border: 1px solid #eef2f8;
      transition: all 0.2s;
    }

    .darisHeader {
      padding: 16px 20px;
      background: #fafcff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 24px 24px 0 0;
      transition: background 0.2s;
      font-weight: 500;
    }

    .darisHeader:hover {
      background: #f1f5fe;
    }

    .darisTitle {
      display: flex;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
      font-size: 1.05rem;
    }

    .darisTitle span:first-child {
      font-weight: 500;
      color: #475569;
    }

    .darisTitle span:last-child {
      font-weight: 700;
      color: #0f172a;
      background: #eef2ff;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 0.85rem;
    }

    .toggleIcon {
      font-size: 1.2rem;
      font-weight: 600;
      color: #5b6e8c;
    }

    .darisContent {
      padding: 20px;
      border-top: 1px solid #ecf3fa;
      background: #ffffff;
      border-radius: 0 0 24px 24px;
    }

    /* rækker */
    .row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .row label {
      min-width: 130px;
      margin-bottom: 0;
    }

    .row input,
    .row select {
      flex: 1;
    }

    /* gæstebokse */
    .guestRow {
      background: #f9fafc;
      border-radius: 20px;
      padding: 18px;
      margin-top: 14px;
      border: 1px solid #eef2f8;
      transition: all 0.1s;
    }

    .guestTop {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .guestTop label {
      margin-bottom: 0;
    }

    .guestTop input {
      flex: 2;
      min-width: 160px;
    }

    .guestControls {
      display: flex;
      gap: 8px;
    }

    .btnStatus {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 40px;
      font-weight: 500;
      transition: 0.1s;
    }

    .btnActive {
      background: #1f6feb;
      color: white;
      border-color: #1f6feb;
      box-shadow: 0 2px 6px rgba(31, 111, 235, 0.2);
    }

    .detailRow {
      margin: 12px 0 0 0;
      width: 100%;
    }

    .topicBox {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px 14px;
      margin: 12px 0;
      border: 1px solid #e9edf2;
    }

    .inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      padding: 4px 12px;
      border-radius: 40px;
      margin: 4px 8px 4px 0;
    }

    .reasonBox {
      background: #fff8e7;
      border-left: 5px solid #f5a623;
      padding: 14px 16px;
      border-radius: 20px;
      margin: 12px 0;
    }

    .reasonBox label {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    /* indsamlede svar */
    .entry {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 20px;
      margin-top: 16px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid #eef2fa;
    }

    .smallGray {
      color: #5b6e8c;
      font-size: 0.85rem;
    }

    .error {
      outline: 2px solid #ff8a7a;
      background-color: #fff6f5;
      border-radius: 14px;
    }

    /* hjælpetekster */
    .helper-hint {
      font-size: 0.8rem;
      color: #54708f;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background: #eef2ff;
      padding: 2px 10px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    @media (max-width: 680px) {
      .form-card {
        padding: 1.2rem;
      }

      .controls button {
        width: 100%;
        justify-content: center;
      }

      .row {
        flex-direction: column;
        gap: 8px;
      }

      .guestTop {
        flex-direction: column;
        align-items: stretch;
      }

      .inline {
        display: flex;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="form-card">
      <h1>📋 Mushrif · Daris · Gæster</h1>
      <div class="subhead">✅ Udfyld oplysninger nedenfor — klik på daris-bokse for at udfolde / skjule detaljer</div>

      <form id="form">
        <div class="field-group">
          <label>👤 Mushrif (ansvarlig)</label>
          <input id="mushrif" type="text" placeholder="Skriv mushrif-navn her" required>
        </div>

        <div id="darisList"></div>

        <div class="controls">
          <button type="button" id="addDaris" class="addBtn">➕ Tilføj daris</button>
          <button type="submit" class="primary">📨 Send indberetning</button>
          <button type="button" id="clearAll" class="removeBtn">🗑️ Ryd lokal gem</button>
          <button type="button" id="downloadXlsx" class="download">📎 Download XLSX (lokal)</button>
        </div>
      </form>
    </div>

    <div id="resultsContainer">
      <h2>📦 Indsamlede svar <span style="font-size: 0.8rem; font-weight: normal;">(gemt lokalt)</span></h2>
      <div id="results"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      if (!window.supabase) {
        alert('⚠️ Supabase klient ikke indlæst – tjek internet / konsol.');
      }
      const supabaseDownloadBtn = document.createElement('button');
      supabaseDownloadBtn.textContent = '☁️ Download fra Supabase (XLSX)';
      supabaseDownloadBtn.className = 'download';
      supabaseDownloadBtn.style.marginLeft = '0px';
      supabaseDownloadBtn.addEventListener('click', downloadFromSupabase);
      document.querySelector('.controls').appendChild(supabaseDownloadBtn);
    });

    (function () {
      const STORAGE_KEY = 'forms_responses_v7_ux';
      let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      const darisList = document.getElementById('darisList');
      const addDarisBtn = document.getElementById('addDaris');
      const form = document.getElementById('form');
      const resultsDiv = document.getElementById('results');
      const clearAllBtn = document.getElementById('clearAll');
      const downloadXlsxBtn = document.getElementById('downloadXlsx');

      const TOPICS = [
        { val: 'kollektiv ansvar', label: 'Kollektiv ansvar' },
        { val: 'nafsiyyah', label: 'Nafsiyyah-relateret' },
        { val: 'politiske emner', label: 'Politiske emner' },
        { val: 'familie', label: 'Familie (private problemer)' },
        { val: 'ægteskab', label: 'Ægteskabsproblemer' },
        { val: 'manglende mening', label: 'Manglende mening (ensomhed/sygdom)' },
        { val: 'arbejde', label: 'Arbejde' },
        { val: 'andet', label: 'Andet (skriv 2-3 ord)' }
      ];

      function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); }
      function escapeHtml(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

      function renderSaved() {
        resultsDiv.innerHTML = '';
        if (!saved.length) { resultsDiv.innerHTML = '<div style="background:#fff; border-radius:24px; padding:28px; text-align:center; color:#5f7f9e;">📭 Ingen indberetninger endnu. Udfyld formularen og tryk "Send".</div>'; return; }
        saved.forEach((rec, idx) => {
          const box = document.createElement('div'); box.className = 'entry';
          const header = document.createElement('div');
          header.innerHTML = `<strong>👤 ${escapeHtml(rec.mushrif)}</strong> <span class="smallGray">📅 ${rec.date}</span>`;
          box.appendChild(header);
          if (rec.daris && rec.daris.length) {
            rec.daris.forEach(d => {
              const dDiv = document.createElement('div'); dDiv.style.marginTop = '12px';
              dDiv.innerHTML = `<div style="font-weight:600">📌 Daris: ${escapeHtml(d.name)} <span class="smallGray">(iftar iftarat: ${d.iftarat ?? 0})</span></div>`;
              if (d.iftarat === 0) {
                const reasons = (d.reasons && d.reasons.length) ? d.reasons.join('; ') : 'Ingen årsag';
                const p = document.createElement('p'); p.className = 'smallGray'; p.innerHTML = `⚠️ Årsag(er): ${escapeHtml(reasons)}`; dDiv.appendChild(p);
              }
              if (d.guests && d.guests.length) {
                const ul = document.createElement('ul'); ul.style.marginTop = '8px'; ul.style.paddingLeft = '20px';
                d.guests.forEach(g => {
                  const li = document.createElement('li');
                  const topics = (g.topics && g.topics.length) ? g.topics.join('; ') : '';
                  li.innerHTML = `<strong>🧑‍🤝‍🧑 Gæst:</strong> ${escapeHtml(g.name)} — <strong>Ankom:</strong> ${g.arrived ? '✅ ja' : '❌ nej'} — <strong>Halaqa:</strong> ${g.halaqa || '—'} — <strong>Uddybning:</strong> ${escapeHtml(g.halaqaDetail || '—')} — <strong>Emner:</strong> ${escapeHtml(topics)} — <strong>Indtryk:</strong> ${escapeHtml(g.impression || '—')} ${g.feedback ? ' — Feedback: ' + escapeHtml(g.feedback) : ''}`;
                  ul.appendChild(li);
                });
                dDiv.appendChild(ul);
              }
              box.appendChild(dDiv);
            });
          }
          const delBtn = document.createElement('button'); delBtn.textContent = '🗑️ Fjern post'; delBtn.className = 'removeBtn';
          delBtn.style.marginTop = '12px'; delBtn.addEventListener('click', () => { if (!confirm('Slet denne indberetning permanent?')) return; saved.splice(idx, 1); persist(); renderSaved(); });
          box.appendChild(delBtn);
          resultsDiv.appendChild(box);
        });
      }

      function createTopicsBlock(initial = []) {
        const wrapper = document.createElement('div'); wrapper.className = 'topicBox';
        const row = document.createElement('div'); row.style.display = 'flex'; row.style.flexWrap = 'wrap';
        TOPICS.forEach(opt => {
          const span = document.createElement('label'); span.className = 'inline';
          const chk = document.createElement('input'); chk.type = 'checkbox'; chk.value = opt.val;
          if (initial.includes(opt.val)) chk.checked = true;
          span.appendChild(chk);
          span.appendChild(document.createTextNode(' ' + opt.label));
          if (opt.val === 'andet') {
            const txt = document.createElement('input'); txt.type = 'text'; txt.placeholder = 'Skriv kort'; txt.style.marginLeft = '8px'; txt.style.width = 'auto'; txt.style.minWidth = '120px';
            const extras = initial.filter(i => !TOPICS.map(t => t.val).includes(i));
            if (extras.length) { chk.checked = true; txt.value = extras.join('; '); }
            txt.disabled = !chk.checked;
            chk.addEventListener('change', () => txt.disabled = !chk.checked);
            span.appendChild(txt);
          }
          row.appendChild(span);
        });
        wrapper.appendChild(row);
        return wrapper;
      }
      function readTopicsBlock(wrapper) {
        if (!wrapper) return [];
        const checks = Array.from(wrapper.querySelectorAll('input[type="checkbox"]'));
        const out = [];
        checks.forEach(chk => {
          if (chk.checked) {
            const labelText = chk.parentElement.textContent || '';
            if (labelText.toLowerCase().includes('andet')) {
              const txt = chk.parentElement.querySelector('input[type="text"]');
              if (txt && txt.value.trim()) out.push(txt.value.trim());
              else out.push('andet');
            } else out.push(chk.value);
          }
        });
        return out;
      }

      function createGuestRow(initial = {}) {
        const guestRow = document.createElement('div'); guestRow.className = 'guestRow';
        const top = document.createElement('div'); top.className = 'guestTop';
        const lbl = document.createElement('label'); lbl.className = 'smallLabel'; lbl.textContent = '🧑 Navn:';
        const input = document.createElement('input'); input.type = 'text'; input.placeholder = 'Gæstens fulde navn'; input.style.flex = '1'; input.value = initial.name || '';
        const statusWrap = document.createElement('div'); statusWrap.className = 'guestControls';
        const btnAnkom = document.createElement('button'); btnAnkom.type = 'button'; btnAnkom.className = 'btnStatus'; btnAnkom.textContent = '✅ Ankom';
        const btnIkke = document.createElement('button'); btnIkke.type = 'button'; btnIkke.className = 'btnStatus'; btnIkke.textContent = '❌ Ankom-ikke';
        let arrived = typeof initial.arrived === 'boolean' ? initial.arrived : null;
        function updateStatusUI() {
          if (arrived === true) { btnAnkom.classList.add('btnActive'); btnIkke.classList.remove('btnActive'); }
          else if (arrived === false) { btnIkke.classList.add('btnActive'); btnAnkom.classList.remove('btnActive'); }
          else { btnAnkom.classList.remove('btnActive'); btnIkke.classList.remove('btnActive'); }
          const show = arrived === true;
          halaqaRow.style.display = show ? 'flex' : 'none';
          topicsBlock.style.display = show ? 'block' : 'none';
          impressionRow.style.display = show ? 'flex' : 'none';
          feedbackArea.style.display = show ? 'block' : 'none';
          detailRow.style.display = show ? 'flex' : 'none';
        }
        btnAnkom.addEventListener('click', () => { arrived = true; updateStatusUI(); });
        btnIkke.addEventListener('click', () => { arrived = false; updateStatusUI(); });
        statusWrap.appendChild(btnAnkom); statusWrap.appendChild(btnIkke);
        const removeGuest = document.createElement('button'); removeGuest.type = 'button'; removeGuest.className = 'removeBtn'; removeGuest.textContent = '❌ Fjern gæst';
        removeGuest.addEventListener('click', () => guestRow.remove());
        top.appendChild(lbl); top.appendChild(input); top.appendChild(statusWrap); top.appendChild(removeGuest);

        const halaqaRow = document.createElement('div'); halaqaRow.style.display = 'none'; halaqaRow.style.marginTop = '12px'; halaqaRow.style.gap = '16px'; halaqaRow.style.alignItems = 'center'; halaqaRow.style.flexWrap = 'wrap';
        const hLabel = document.createElement('label'); hLabel.className = 'small'; hLabel.textContent = '📖 Interesse i halaqa:';
        const hamount = document.createElement('div'); hamount.style.display = 'flex'; hamount.style.gap = '16px';
        const radioYes = document.createElement('input'); radioYes.type = 'radio'; radioYes.name = 'halaqa_' + Math.random().toString(36).slice(2, 8); radioYes.value = 'ja';
        const lYes = document.createElement('label'); lYes.appendChild(radioYes); lYes.appendChild(document.createTextNode(' Ja '));
        const radioNo = document.createElement('input'); radioNo.type = 'radio'; radioNo.name = radioYes.name; radioNo.value = 'nej';
        const lNo = document.createElement('label'); lNo.appendChild(radioNo); lNo.appendChild(document.createTextNode(' Nej '));
        hamount.appendChild(lYes); hamount.appendChild(lNo);
        halaqaRow.appendChild(hLabel); halaqaRow.appendChild(hamount);

        const detailRow = document.createElement('div'); detailRow.className = 'detailRow'; detailRow.style.display = 'none'; detailRow.style.flexDirection = 'column'; detailRow.style.gap = '6px';
        const detailLabel = document.createElement('label'); detailLabel.className = 'small'; detailLabel.textContent = '✍️ Uddybning (interesse / bemærkning):';
        const detailInput = document.createElement('input'); detailInput.type = 'text'; detailInput.placeholder = 'Beskriv nærmere...'; detailInput.style.width = '100%';
        detailInput.value = initial.halaqaDetail || '';
        detailRow.appendChild(detailLabel); detailRow.appendChild(detailInput);

        const topicsBlock = createTopicsBlock(initial.topics || []);
        topicsBlock.style.display = 'none';

        const impressionRow = document.createElement('div'); impressionRow.style.marginTop = '12px'; impressionRow.style.display = 'none'; impressionRow.style.gap = '20px'; impressionRow.style.alignItems = 'center'; impressionRow.style.flexWrap = 'wrap';
        const impLabel = document.createElement('span'); impLabel.className = 'smallLabel'; impLabel.textContent = '😊 Indtryk:';
        const impYes = document.createElement('input'); impYes.type = 'radio'; impYes.name = 'impression_' + Math.random().toString(36).slice(2, 8); impYes.value = 'positiv';
        const lblYes = document.createElement('label'); lblYes.appendChild(impYes); lblYes.appendChild(document.createTextNode(' Positivt '));
        const impNo = document.createElement('input'); impNo.type = 'radio'; impNo.name = impYes.name; impNo.value = 'negativ';
        const lblNo = document.createElement('label'); lblNo.appendChild(impNo); lblNo.appendChild(document.createTextNode(' Negativt '));
        impressionRow.appendChild(impLabel); impressionRow.appendChild(lblYes); impressionRow.appendChild(lblNo);

        const feedbackArea = document.createElement('textarea'); feedbackArea.className = 'guestFeedback'; feedbackArea.placeholder = '💬 Feedback / forbedringsforslag (valgfri)'; feedbackArea.value = initial.feedback || '';
        feedbackArea.style.display = 'none'; feedbackArea.rows = 2;

        if (initial.arrived === true || initial.arrived === false) arrived = initial.arrived;
        if (initial.halaqa === 'ja') radioYes.checked = true;
        if (initial.halaqa === 'nej') radioNo.checked = true;
        if (initial.impression === 'positiv') impYes.checked = true;
        if (initial.impression === 'negativ') impNo.checked = true;
        updateStatusUI();

        guestRow.appendChild(top);
        guestRow.appendChild(halaqaRow);
        guestRow.appendChild(detailRow);
        guestRow.appendChild(topicsBlock);
        guestRow.appendChild(impressionRow);
        guestRow.appendChild(feedbackArea);

        guestRow.getData = function () {
          const name = input.value.trim();
          const halaqa = radioYes.checked ? 'ja' : (radioNo.checked ? 'nej' : '');
          const halaqaDetail = detailInput.value.trim();
          const topics = readTopicsBlock(topicsBlock);
          const impression = impYes.checked ? 'positiv' : (impNo.checked ? 'negativ' : '');
          const feedback = feedbackArea.value.trim();
          return { name, arrived: arrived === true, halaqa, halaqaDetail, topics, impression, feedback };
        };
        guestRow.setArrived = function (val) { arrived = val; updateStatusUI(); };
        return guestRow;
      }

      function addDarisFieldFactory(dInit) {
        const box = document.createElement('div'); box.className = 'darisBox';
        const header = document.createElement('div'); header.className = 'darisHeader';
        const titleWrap = document.createElement('div'); titleWrap.className = 'darisTitle';
        const labelSpan = document.createElement('span'); labelSpan.textContent = '👥 Daris navn:';
        const titleText = document.createElement('span'); titleText.textContent = dInit.name || 'Ny daris';
        titleWrap.appendChild(labelSpan); titleWrap.appendChild(titleText);
        const toggle = document.createElement('span'); toggle.className = 'toggleIcon'; toggle.textContent = '▼';
        header.appendChild(titleWrap); header.appendChild(toggle);

        const content = document.createElement('div'); content.className = 'darisContent';
        const nameRow = document.createElement('div'); nameRow.className = 'row';
        const nameLabel = document.createElement('label'); nameLabel.textContent = '📛 Navn:';
        const nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.placeholder = 'Daris (fx Abu Bakr)'; nameInput.value = dInit.name || ''; nameInput.style.flex = '1';
        nameRow.appendChild(nameLabel); nameRow.appendChild(nameInput);

        const iftarRow = document.createElement('div'); iftarRow.className = 'row';
        const iftarLabel = document.createElement('label'); iftarLabel.textContent = '🍽️ Antal iftarat:';
        const iftarInput = document.createElement('input'); iftarInput.type = 'number'; iftarInput.min = '0'; iftarInput.placeholder = '0'; iftarInput.style.width = '140px';
        iftarInput.value = (typeof dInit.iftarat !== 'undefined') ? String(dInit.iftarat) : '';
        iftarRow.appendChild(iftarLabel); iftarRow.appendChild(iftarInput);

        const reasonSection = document.createElement('div'); reasonSection.className = 'reasonBox'; reasonSection.style.display = 'none';
        reasonSection.innerHTML = `
      <div style="margin-bottom:6px;"><strong>⚠️ Årsag(er) til 0 iftarat (påkrævet)</strong></div>
      <label><input type="checkbox" value="manglende økonomi"> 💸 Manglende økonomi</label>
      <label><input type="checkbox" value="umoden"> 🧩 Umoden</label>
      <label><input type="checkbox" value="social udfordret"> 🤝 Social udfordret</label>
      <label>✏️ Andet: <input type="text" placeholder="Skriv anden årsag"></label>
    `;

        const guestsContainer = document.createElement('div'); guestsContainer.style.marginTop = '20px';
        const addGuestBtn = document.createElement('button'); addGuestBtn.type = 'button'; addGuestBtn.className = 'addBtn'; addGuestBtn.innerHTML = '👥 + Tilføj gæst';
        addGuestBtn.addEventListener('click', () => { const gRow = createGuestRow(); guestsContainer.appendChild(gRow); });
        guestsContainer.appendChild(addGuestBtn);

        if (Array.isArray(dInit.guests) && dInit.guests.length) {
          dInit.guests.forEach(g => {
            const gRow = createGuestRow(g);
            guestsContainer.insertBefore(gRow, addGuestBtn);
            if (typeof g.arrived === 'boolean' && gRow.setArrived) gRow.setArrived(g.arrived);
          });
        }

        function evaluateReasonVisibility() { const val = parseInt(iftarInput.value, 10); reasonSection.style.display = (!isNaN(val) && val === 0) ? 'block' : 'none'; }
        iftarInput.addEventListener('input', evaluateReasonVisibility);
        if (parseInt(iftarInput.value, 10) === 0) reasonSection.style.display = 'block';

        const removeDaris = document.createElement('button'); removeDaris.type = 'button'; removeDaris.className = 'removeBtn'; removeDaris.innerHTML = '🗑️ Fjern daris';
        removeDaris.addEventListener('click', () => box.remove());

        content.appendChild(nameRow); content.appendChild(iftarRow); content.appendChild(reasonSection);
        content.appendChild(guestsContainer); content.appendChild(removeDaris);

        let expanded = true;
        header.addEventListener('click', () => {
          if (expanded) { content.style.display = 'none'; toggle.textContent = '▶'; expanded = false; }
          else { content.style.display = 'block'; toggle.textContent = '▼'; expanded = true; }
        });
        nameInput.addEventListener('input', () => { titleText.textContent = nameInput.value.trim() || 'Ny daris'; });

        box.appendChild(header); box.appendChild(content); darisList.appendChild(box);

        return {
          root: box,
          getData: function () {
            const name = nameInput.value.trim();
            const iftar = iftarInput.value.trim() === '' ? 0 : parseInt(iftarInput.value.trim(), 10);
            const reasons = [];
            Array.from(reasonSection.querySelectorAll('input[type="checkbox"]')).forEach(chk => { if (chk.checked) reasons.push(chk.value); });
            const otherTxt = reasonSection.querySelector('input[type="text"]'); if (otherTxt && otherTxt.value.trim()) reasons.push(otherTxt.value.trim());
            const guestEls = Array.from(guestsContainer.querySelectorAll('.guestRow'));
            const guests = guestEls.map(ge => ge.getData ? ge.getData() : { name: '', arrived: false, halaqa: '', halaqaDetail: '', topics: [], impression: '', feedback: '' }).filter(g => g.name && g.name.length > 0);
            return { name, iftarat: isNaN(iftar) ? 0 : iftar, reasons, guests };
          }
        };
      }

      addDarisBtn.addEventListener('click', () => addDarisFieldFactory({}));
      if (!darisList.querySelector('.darisBox')) addDarisFieldFactory({});

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
        const mushrif = document.getElementById('mushrif').value.trim();
        if (!mushrif) { alert('Indtast venligst navn på mushrif (obligatorisk).'); document.getElementById('mushrif').focus(); return; }

        const darisBoxes = Array.from(darisList.querySelectorAll('.darisBox'));
        const darisArr = [];
        let validationFailed = false;
        let firstInvalid = null;

        darisBoxes.forEach(box => {
          const nameInput = box.querySelector('input[type="text"]');
          const darisName = nameInput ? nameInput.value.trim() : '';
          if (!darisName) return;
          const iftarInput = box.querySelector('input[type="number"]');
          const iftarVal = iftarInput && iftarInput.value.trim() !== '' ? parseInt(iftarInput.value.trim(), 10) : 0;
          const reasonSection = box.querySelector('.reasonBox');
          const reasons = [];
          if (reasonSection) {
            Array.from(reasonSection.querySelectorAll('input[type="checkbox"]')).forEach(chk => { if (chk.checked) reasons.push(chk.value); });
            const other = reasonSection.querySelector('input[type="text"]'); if (other && other.value.trim()) reasons.push(other.value.trim());
          }
          if (iftarVal === 0 && (!reasons || reasons.length === 0)) {
            validationFailed = true;
            if (reasonSection) reasonSection.classList.add('error');
            if (!firstInvalid) firstInvalid = reasonSection || box;
          }
          const guestEls = Array.from(box.querySelectorAll('.guestRow'));
          const guests = guestEls.map(ge => ge.getData ? ge.getData() : { name: '', arrived: false, halaqa: '', halaqaDetail: '', topics: [], impression: '', feedback: '' }).filter(g => g.name && g.name.length > 0);
          darisArr.push({ name: darisName, iftarat: isNaN(iftarVal) ? 0 : iftarVal, reasons, guests });
        });

        if (validationFailed) { alert('⚠️ Mindst én daris har 0 iftarat – angiv mindst én årsag i det markerede felt.'); if (firstInvalid && firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

        const rec = { mushrif, daris: darisArr, date: new Date().toLocaleString('da-DK') };
        const supabaseOk = await saveToSupabase(rec);
        saved.unshift(rec); persist(); renderSaved();
        alert(`✅ Indberetning gemt (${mushrif})` + (supabaseOk ? ' & synkroniseret til Supabase' : ' – kun lokal backup'));
        document.getElementById('mushrif').value = '';
        darisList.innerHTML = '';
        addDarisFieldFactory({});
      });

      clearAllBtn.addEventListener('click', () => {
        if (!confirm('Slet ALLE gemte indberetninger fra denne browser?')) return;
        saved = []; persist(); renderSaved();
      });

      function gatherFlatRows(records = saved) {
        const flat = [];
        records.forEach(rec => {
          rec.daris.forEach(d => {
            const reasonsStr = d.reasons ? d.reasons.join('; ') : '';
            if (d.guests && d.guests.length) {
              d.guests.forEach(g => {
                flat.push({
                  Mushrif: rec.mushrif, Daris: d.name, 'Antal iftarat': d.iftarat, Årsager: reasonsStr,
                  Gæst: g.name || '', Ankom: g.arrived ? 'Ja' : 'Nej', 'Interesse i halaqa': g.halaqa || '',
                  Uddybning: g.halaqaDetail || '', Emner: Array.isArray(g.topics) ? g.topics.join('; ') : '',
                  Indtryk: g.impression || '', Feedback: g.feedback || '', Dato: rec.date
                });
              });
            } else {
              flat.push({ Mushrif: rec.mushrif, Daris: d.name, 'Antal iftarat': d.iftarat, Årsager: reasonsStr, Gæst: '', Ankom: '', 'Interesse i halaqa': '', Uddybning: '', Emner: '', Indtryk: '', Feedback: '', Dato: rec.date });
            }
          });
        });
        return flat;
      }

      downloadXlsxBtn.addEventListener('click', () => {
        if (!saved.length) { alert('Ingen data at downloade – indsend først.'); return; }
        const ws = XLSX.utils.json_to_sheet(gatherFlatRows(), { header: ['Mushrif', 'Daris', 'Antal iftarat', 'Årsager', 'Gæst', 'Ankom', 'Interesse i halaqa', 'Uddybning', 'Emner', 'Indtryk', 'Feedback', 'Dato'] });
        ws['!cols'] = [{ wch: 20 }, { wch: 20 }, { wch: 14 }, { wch: 30 }, { wch: 20 }, { wch: 10 }, { wch: 18 }, { wch: 30 }, { wch: 30 }, { wch: 12 }, { wch: 40 }, { wch: 20 }];
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Indsamling');
        XLSX.writeFile(wb, `indsamling_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.xlsx`);
      });

      async function saveToSupabase(record) {
        if (!window.supabase) return false;
        try {
          const { error } = await window.supabase.from('mushrif_indberetninger').insert([{ mushrif: record.mushrif, data_json: record }]);
          if (error) throw error;
          return true;
        } catch (err) { console.error(err); alert('Supabase fejl: ' + err.message); return false; }
      }

      async function downloadFromSupabase() {
        if (!window.supabase) { alert('Supabase ikke klar'); return; }
        try {
          const { data, error } = await window.supabase.from('mushrif_indberetninger').select('mushrif, data_json, created_at').order('created_at', { ascending: false });
          if (error) throw error;
          if (!data?.length) { alert('Ingen data i Supabase'); return; }
          const supabaseRecords = data.map(row => ({ mushrif: row.mushrif, daris: row.data_json.daris || [], date: row.created_at ? new Date(row.created_at).toLocaleString('da-DK') : 'Ukendt dato' }));
          const ws = XLSX.utils.json_to_sheet(gatherFlatRows(supabaseRecords), { header: ['Mushrif', 'Daris', 'Antal iftarat', 'Årsager', 'Gæst', 'Ankom', 'Interesse i halaqa', 'Uddybning', 'Emner', 'Indtryk', 'Feedback', 'Dato'] });
          ws['!cols'] = [{ wch: 20 }, { wch: 20 }, { wch: 14 }, { wch: 30 }, { wch: 20 }, { wch: 10 }, { wch: 18 }, { wch: 30 }, { wch: 30 }, { wch: 12 }, { wch: 40 }, { wch: 20 }];
          const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Supabase Data');
          XLSX.writeFile(wb, `supabase_export_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.xlsx`);
        } catch (err) { console.error(err); alert('Fejl ved hentning: ' + (err.message || '')); }
      }

      renderSaved();
    })();
  </script>
</body>

</html>
